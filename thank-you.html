<script id="sitewide-motion-script-v2">
(() => {
  const start = () => {
    document.body.classList.add('motion-ready');
    const selectors = [
      'main section > .wrap','section > .wrap','.price-card','.package-card','.compare-card',
      '.actor-card','.reel-card','.work-card','.feature-card','.service-card','.faq-item',
      '.final-cta-inner','footer .footer-inner','article'
    ];
    const seen = new Set();
    document.querySelectorAll(selectors.join(',')).forEach((el, i) => {
      if (seen.has(el) || el.closest('.hero-stage,.hero-sticky')) return;
      seen.add(el); el.classList.add('motion-item');
      el.style.setProperty('--motion-delay', `${Math.min((i % 6) * 65, 325)}ms`);
    });
    const items=[...document.querySelectorAll('.motion-item')];
    if (!('IntersectionObserver' in window)) items.forEach(x=>x.classList.add('is-visible'));
    else {
      const io=new IntersectionObserver(entries=>entries.forEach(entry=>{
        if(entry.isIntersecting){entry.target.classList.add('is-visible');io.unobserve(entry.target)}
      }),{threshold:.12,rootMargin:'0px 0px -7% 0px'});
      items.forEach(el=>io.observe(el));
    }
    const touchTargets=document.querySelectorAll('.price-card,.package-card,.compare-card,.actor-card,.reel-card,.work-card,.feature-card,.service-card,.btn');
    touchTargets.forEach(el=>{
      el.addEventListener('touchstart',()=>el.classList.add('motion-touch-active'),{passive:true});
      ['touchend','touchcancel'].forEach(type=>el.addEventListener(type,()=>el.classList.remove('motion-touch-active'),{passive:true}));
    });
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true}); else start();
})();
</script>
